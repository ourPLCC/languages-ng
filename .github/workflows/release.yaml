---
# yamllint disable line-length
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The release App's token does the writing now: it creates the tag and the
# Release, and as the tag ruleset's only bypass actor it is the one
# identity allowed to push a tag. GITHUB_TOKEN only needs to read the
# repository.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      -
        name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      -
        name: Tag
        # The preset's major must match the conventional-changelog-writer
        # that semantic-release's own release-notes-generator loads.
        # semantic-release@25 ships release-notes-generator@14, which loads
        # writer@8, and preset@10 needs writer@9 or newer: generateNotes
        # fails with "Missing helper". Preset@9 is the major built for
        # writer@8. Raise both pins together, to @26 and preset@10, once
        # semantic-release@26 (release-notes-generator@15, writer@9) is
        # stable.
        run: >
          npx --yes
          -p semantic-release@25
          -p conventional-changelog-conventionalcommits@9
          semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
