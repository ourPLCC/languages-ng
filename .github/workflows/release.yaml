---
# yamllint disable line-length
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The release App's token does the writing now: it creates the tag and the
# Release, and as the tag ruleset's only bypass actor it is the one
# identity allowed to push a tag. GITHUB_TOKEN only needs to read the
# repository.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      -
        name: Mint release App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      -
        name: Tag
        run: >
          npx --yes
          -p semantic-release@25
          -p conventional-changelog-conventionalcommits@10
          semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
