---
name: Test Languages

# Runs inside the same image .devcontainer/devcontainer.json pins, so a
# local pass predicts a CI pass. bin/tests/image-pin.bats fails if these
# two files ever name different images.
#
# The push trigger is a backstop, not the gate: release.yaml runs on
# push to main, so an unverified commit reaching main would cut a
# release from untested code. The gate is the required status check on
# pull requests -- see CONTRIBUTING.md.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Languages
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ourplcc/devcontainers/plcc-ng:2.0.2@sha256:ebab585854e2c2dd5133db9616b398f6ede19702b514a5f4ace14757ae63dc9a
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        # actions/checkout does add the workspace as a safe directory,
        # but it does so under a HOME it overrides for the duration of
        # that step and then discards -- the log says so out loud:
        # "Temporarily overriding HOME=... before making global git
        # config changes". So the setting never reaches this job's other
        # steps, where HOME is /github/home.
        #
        # It has to reach them. The workspace is owned by the runner's
        # uid rather than the container user's, so without this git
        # refuses the checkout as dubious ownership, and bin/relocate.bash
        # -- which every language test calls, and which runs git ls-files
        # to decide what to copy -- fails for all 165 of them. Running the
        # container as root does not help; root does not own it either.
        name: Trust the workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      -
        name: Install bats
        run: |
          bin/install/bats.bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      -
        name: Test languages
        run: bin/test.bash
